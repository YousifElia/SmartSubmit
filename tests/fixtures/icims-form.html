<!doctype html>
<!--
  Replica of an iCIMS application step, as shown inside the career site's
  iframe: a server-rendered form with ordinary labels and iCIMS's dotted
  field names, and dropdowns that are native selects hidden behind an
  enhanced widget which follows the select's change events. Invented content.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Candidate Profile | Careers at Northwind Systems</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; padding: 0 16px; }
      .iCIMS_TableRow { margin: 14px 0; }
      .iCIMS_TableLabel { display: block; font-weight: bold; margin-bottom: 4px; }
      .iCIMS_RequiredField { color: #b00; }
      input.form-control, textarea.form-control { width: 100%; max-width: 420px; padding: 6px; box-sizing: border-box; }
      .dropdown { position: relative; display: inline-block; min-width: 260px; }
      .dropdown-toggle { width: 100%; text-align: left; padding: 6px; background: #fff; border: 1px solid #999; }
      .dropdown-menu { position: absolute; z-index: 5; background: #fff; border: 1px solid #ccc; list-style: none; margin: 0; padding: 4px 0; width: 100%; }
      .dropdown-menu li { padding: 4px 10px; cursor: pointer; }
      fieldset { border: 0; padding: 0; }
      .iCIMS_Header { font-size: 20px; }
    </style>
  </head>
  <body>
    <div class="iCIMS_MainWrapper">
      <h1 class="iCIMS_Header">Software Developer Co-op</h1>
      <form id="icims_application_form" class="iCIMS_Forms" method="post" action="#">
        <h2>Candidate Profile</h2>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_PersonProfileFields.FirstName">First Name <span class="iCIMS_RequiredField">*</span></label><input type="text" class="form-control" id="-1_PersonProfileFields.FirstName" name="-1_PersonProfileFields.FirstName" required /></div>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_PersonProfileFields.MiddleName">Middle Name</label><input type="text" class="form-control" id="-1_PersonProfileFields.MiddleName" name="-1_PersonProfileFields.MiddleName" /></div>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_PersonProfileFields.LastName">Last Name <span class="iCIMS_RequiredField">*</span></label><input type="text" class="form-control" id="-1_PersonProfileFields.LastName" name="-1_PersonProfileFields.LastName" required /></div>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_PersonProfileFields.Email">Email <span class="iCIMS_RequiredField">*</span></label><input type="email" class="form-control" id="-1_PersonProfileFields.Email" name="-1_PersonProfileFields.Email" required /></div>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_PersonProfileFields.PhoneNumber">Phone Number <span class="iCIMS_RequiredField">*</span></label><input type="tel" class="form-control" id="-1_PersonProfileFields.PhoneNumber" name="-1_PersonProfileFields.PhoneNumber" required /></div>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_PersonProfileFields.PhoneType">Phone Type</label>
          <select class="iCIMS_Enhanced" id="-1_PersonProfileFields.PhoneType" name="-1_PersonProfileFields.PhoneType"><option value="">— Make a Selection —</option><option value="H">Home</option><option value="M">Mobile</option><option value="W">Work</option></select></div>

        <h2>Address</h2>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_PersonProfileFields.AddressStreet1">Street Address</label><input type="text" class="form-control" id="-1_PersonProfileFields.AddressStreet1" name="-1_PersonProfileFields.AddressStreet1" /></div>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_PersonProfileFields.AddressCity">City</label><input type="text" class="form-control" id="-1_PersonProfileFields.AddressCity" name="-1_PersonProfileFields.AddressCity" /></div>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_PersonProfileFields.AddressCountry">Country</label>
          <select class="iCIMS_Enhanced" id="-1_PersonProfileFields.AddressCountry" name="-1_PersonProfileFields.AddressCountry"><option value="">— Make a Selection —</option><option value="CA">Canada</option><option value="US">United States</option></select></div>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_PersonProfileFields.AddressState">State/Province</label>
          <select class="iCIMS_Enhanced" id="-1_PersonProfileFields.AddressState" name="-1_PersonProfileFields.AddressState"><option value="">— Make a Selection —</option><option value="AB">Alberta</option><option value="BC">British Columbia</option><option value="ON">Ontario</option><option value="QC">Quebec</option></select></div>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_PersonProfileFields.AddressZip">Zip/Postal Code</label><input type="text" class="form-control" id="-1_PersonProfileFields.AddressZip" name="-1_PersonProfileFields.AddressZip" /></div>

        <h2>Resume</h2>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_ResumeUpload">Resume <span class="iCIMS_RequiredField">*</span></label><input type="file" id="-1_ResumeUpload" name="-1_ResumeUpload" accept=".pdf,.doc,.docx" /></div>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_PersonProfileFields.LinkedInURL">LinkedIn Profile URL</label><input type="url" class="form-control" id="-1_PersonProfileFields.LinkedInURL" name="-1_PersonProfileFields.LinkedInURL" /></div>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_Source">How did you hear about this position?</label>
          <select class="iCIMS_Enhanced" id="-1_Source" name="-1_Source"><option value="">— Make a Selection —</option><option>Company Website</option><option>Employee Referral</option><option>Indeed</option><option>Job Fair</option><option>LinkedIn</option><option>Other</option></select></div>

        <h2>Questions</h2>
        <fieldset class="iCIMS_TableRow"><legend class="iCIMS_TableLabel">Are you legally eligible to work in Canada? <span class="iCIMS_RequiredField">*</span></legend>
          <input type="radio" id="q1y" name="-1_Q1" value="Yes" /><label for="q1y">Yes</label>
          <input type="radio" id="q1n" name="-1_Q1" value="No" /><label for="q1n">No</label></fieldset>
        <fieldset class="iCIMS_TableRow"><legend class="iCIMS_TableLabel">Will you now or in the future require sponsorship to work in Canada? <span class="iCIMS_RequiredField">*</span></legend>
          <input type="radio" id="q2y" name="-1_Q2" value="Yes" /><label for="q2y">Yes</label>
          <input type="radio" id="q2n" name="-1_Q2" value="No" /><label for="q2n">No</label></fieldset>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_Education">Highest level of education completed</label>
          <select class="iCIMS_Enhanced" id="-1_Education" name="-1_Education"><option value="">— Make a Selection —</option><option>High School Diploma</option><option>College Diploma</option><option>Bachelor's Degree</option><option>Master's Degree</option><option>Doctorate</option></select></div>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_Salary">Desired Annual Salary</label><input type="text" class="form-control" id="-1_Salary" name="-1_Salary" /></div>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_Why">Why do you want to join Northwind Systems?</label><textarea class="form-control" id="-1_Why" name="-1_Why" rows="4"></textarea></div>

        <h2>Voluntary Self-Identification</h2>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_Gender">Gender</label>
          <select class="iCIMS_Enhanced" id="-1_Gender" name="-1_Gender"><option value="">— Make a Selection —</option><option>Female</option><option>Male</option><option>I choose not to disclose</option></select></div>
        <div class="iCIMS_TableRow"><label class="iCIMS_TableLabel" for="-1_Veteran">Veteran Status</label>
          <select class="iCIMS_Enhanced" id="-1_Veteran" name="-1_Veteran"><option value="">— Make a Selection —</option><option>I am a protected veteran</option><option>I am not a protected veteran</option><option>I choose not to disclose</option></select></div>
        <div class="iCIMS_TableRow"><label><input type="checkbox" name="-1_Certify" /> I certify that the information provided in this application is true and complete.</label></div>
        <button type="submit" class="iCIMS_PrimaryButton">Submit Application</button>
      </form>
    </div>
    <script>
      window.__submitted = false;
      document.getElementById('icims_application_form').addEventListener('submit', (e) => { e.preventDefault(); window.__submitted = true; });
      // The enhanced dropdown: the select is hidden, and a button with a list stands in for it.
      document.querySelectorAll('select.iCIMS_Enhanced').forEach((select) => {
        select.style.display = 'none';
        const widget = document.createElement('div');
        widget.className = 'dropdown iCIMS_DropdownField';
        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'dropdown-toggle';
        toggle.setAttribute('aria-haspopup', 'listbox');
        toggle.setAttribute('aria-expanded', 'false');
        const shown = () => (select.selectedIndex > 0 ? select.options[select.selectedIndex].text : '— Make a Selection —');
        toggle.textContent = shown();
        const menu = document.createElement('ul');
        menu.className = 'dropdown-menu';
        menu.setAttribute('role', 'listbox');
        menu.hidden = true;
        [...select.options].slice(1).forEach((option, i) => {
          const item = document.createElement('li');
          item.setAttribute('role', 'option');
          item.textContent = option.text;
          item.addEventListener('click', () => {
            select.selectedIndex = i + 1;
            select.dispatchEvent(new Event('change', { bubbles: true }));
            menu.hidden = true;
            toggle.setAttribute('aria-expanded', 'false');
          });
          menu.appendChild(item);
        });
        toggle.addEventListener('click', () => {
          menu.hidden = !menu.hidden;
          toggle.setAttribute('aria-expanded', String(!menu.hidden));
        });
        select.addEventListener('change', () => (toggle.textContent = shown()));
        widget.append(toggle, menu);
        select.after(widget);
      });
    </script>
  </body>
</html>
