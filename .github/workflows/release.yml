name: Release

# Push a tag such as v0.1.0 to publish the extension zips as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pdftotext (the PDF tests read generated PDFs with it)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm run typecheck
      - run: npm test
      - run: npm run zip:all
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .output/*.zip --title "SmartSubmit $GITHUB_REF_NAME" --generate-notes
